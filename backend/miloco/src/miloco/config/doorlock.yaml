# 门锁 / 门铃事件专用配置
#
# 这个文件放在仓库内，作为 Miloco 的门锁默认配置模板；运行时加载优先级低于
# $MILOCO_HOME/config.json 和 MILOCO_* 环境变量，高于通用 settings.yaml。
#
# 生产使用建议：
# - 把真实 did、siid、eiid、session_key 写入 $MILOCO_HOME/config.json，避免把个人设备
#   标识和本机 OpenClaw 会话提交到仓库；
# - 若要在仓库分支里固定某套开发环境，可直接修改本文件。
#
# MIoT 事件 topic 形如：
#   device/{did}/up/event_occured/{siid}/{eiid}
# 注意：MIoT broker/topic 使用历史拼写 event_occured，不是 event_occurred。
# 完整部署流程见：knowledge/06-dev-guide/doorlock-doorbell-audio.md

miot:
  # doorbell_did
  #   门锁/门铃设备的 MIoT did。
  #   为空（null 或 ""）时，Miloco 不订阅门铃事件，也不会向 OpenClaw 投递门铃消息。
  #   可从日志 [DEBUG-EVENT] topic=device/{did}/... 或设备列表里取得。
  doorbell_did: null

  # doorbell_siid
  #   门铃事件所在服务的 siid。与 doorbell_eiid 一起定位具体事件。
  #   当前已验证的小米智能门锁 5 Max 内外双摄门铃事件为 siid=7。
  doorbell_siid: 7

  # doorbell_eiid
  #   门铃事件的 eiid。与 doorbell_siid 一起定位具体事件。
  #   当前已验证的小米智能门锁 5 Max 内外双摄门铃事件为 eiid=1006。
  doorbell_eiid: 1006

  # doorbell_session_key
  #   门铃事件要投递到的 OpenClaw sessionKey。门锁/门铃访客对话应投递给
  #   司阍(doorman)子 Agent，例如：
  #     agent:doorman:doorbell
  #   为空时使用 Miloco 默认 owner-channel 路由（由 OpenClaw 解析最近/已绑定通知会话）。
  #   注意：门锁“播放 OpenClaw 回复文本”依赖固定 session 的同步返回；如果这里为空，
  #   仍会投递事件，但不会执行门锁唤醒和回复音频播放。
  doorbell_session_key: null

  # doorbell_wake_action_iid
  #   OpenClaw 回复完成后、发送门锁音频前调用的门锁唤醒 action。
  #   格式固定为 action.{siid}.{aiid}，会通过 MIoT action 调用执行，参数为空列表 []。
  #   当前已验证唤醒命令等价于：
  #     miloco-cli device action <did> action.17.3
  #   为空（null 或 ""）时 OpenClaw 侧回退默认 action.17.3。当前链路要求播放音频前先唤醒。
  doorbell_wake_action_iid: action.17.3

  # doorbell_reply_audio_command
  #   播放 OpenClaw 回复文本的外部命令参数列表。Miloco 只把该请求随 webhook 交给
  #   OpenClaw 插件；真正的 TTS、ffmpeg 转码、audio_sender 发送都在 OpenClaw 侧执行。
  #   OpenClaw 插件会先执行 doorbell_wake_action_iid 唤醒门锁，再执行该音频命令。
  #   为空（null）时不请求 OpenClaw 播放音频；适合先只验证“收到事件并生成回复”。
  #   支持占位符：
  #     {text}  OpenClaw 回复文本
  #     {did}   门锁 did
  #     {siid}  门铃事件 siid
  #     {eiid}  门铃事件 eiid
  #   示例（按你的本机脚本实际参数调整）：
  #     ["/path/to/send-doorlock-audio", "--did", "{did}", "--text", "{text}"]
  #   如果脚本需要先把文本转 PCM，再用 audio_sender 发到门锁，可把这些步骤封装到一个脚本里，
  #   然后在这里配置该脚本路径和 {text} 参数。
  doorbell_reply_audio_command: null

  # doorbell_conversation_enabled
  #   是否启用门铃双向语音对话。
  #   true 时：门铃事件进入固定 OpenClaw 会话；OpenClaw 回复播放成功后，Miloco 才监听
  #   门锁旁边的访客语音，并把转写继续发回同一个会话。
  #   false 时：只保留单次门铃事件投递/回复播放，不进入访客拾音和自动追问循环。
  doorbell_conversation_enabled: true

  # doorbell_visitor_listen_seconds
  #   每次门锁回复音频播放成功后，等待访客说话的窗口（秒）。
  #   超过窗口未收到 is_complete=true 且来源 did 匹配的语音，本轮会话结束。
  doorbell_visitor_listen_seconds: 15.0

  # doorbell_audio_activity_extend_seconds
  #   监听窗口内如果门铃来源 DID 检测到明显人声/音频活动，但 ASR 暂时没有产出
  #   is_complete=true 的转写，则把监听窗口至少向后延长这段时间，避免访客刚说话
  #   就被静默兜底打断。<=0 表示关闭该延长逻辑。
  doorbell_audio_activity_extend_seconds: 15.0

  # doorbell_audio_activity_min_speech_probability
  #   触发监听延长的人声概率阈值，对应感知 timing 中的 _gate_speech_prob_<did>。
  doorbell_audio_activity_min_speech_probability: 0.5

  # doorbell_audio_activity_min_energy
  #   触发监听延长的音频能量阈值，对应感知 timing 中的 _gate_audio_energy_<did>。
  doorbell_audio_activity_min_energy: 0.1

  # doorbell_max_turns
  #   单次门铃会话最多接收并转发的访客语音轮数。
  #   例如 3 表示最多转发 3 次“门外访客说：...”，第三次后的 OpenClaw 回复仍会播放，
  #   但播放完成后不再进入新的访客拾音窗口。
  doorbell_max_turns: 3

  # doorbell_visitor_message_prefix
  #   访客语音转写进入 OpenClaw 会话时的前缀。
  #   默认消息形如：门外访客说：我是快递员，我来取快递。
  #   建议保留清晰角色标记，方便 OpenClaw 区分门外访客和屋主/系统消息。
  doorbell_visitor_message_prefix: 门外访客说：

  # doorbell_silence_fallback_enabled
  #   访客监听窗口内无人说话时，是否直接播放固定兜底语音并结束本次门铃会话。
  #   该兜底不再调用 OpenClaw 生成回复，不消耗模型；仍通过 OpenClaw 插件先唤醒门锁，
  #   再执行 doorbell_reply_audio_command 播放下面的固定文案。
  doorbell_silence_fallback_enabled: true

  # doorbell_silence_fallback_text
  #   访客静默超时后播放到门锁的固定兜底文案。
  #   默认会在 doorbell_visitor_listen_seconds 超时后播放一次，然后结束会话。
  doorbell_silence_fallback_text: 我没有听到您的声音，请稍后再按门铃。

  # doorbell_debug_audio_enabled
  #   调试开关：保存门铃会话期间门锁传入的解码音频，便于人工回听 ASR 输入。
  #   默认关闭，避免长期保存门口音频。
  doorbell_debug_audio_enabled: false

  # doorbell_debug_audio_dir
  #   调试音频保存目录；为空时默认写入 $MILOCO_HOME/debug/doorbell-audio。
  doorbell_debug_audio_dir: ""
